<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- Seguridad: la página solo puede cargar código de este sitio y de Firebase (Google),
       y solo puede enviar datos a Firebase. Bloquea código inyectado. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://www.gstatic.com; frame-src https://*.firebaseapp.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f2350">
  <meta name="description" content="Gestiona tus ingresos, gastos, tarjetas, pagos fijos, clientes, ahorros e inversiones. Funciona sin internet.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mis Finanzas">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <title>Mis Finanzas</title>
</head>
<body>
  <header class="topbar">
    <div class="month-nav" id="monthNav">
      <button class="icon-btn" id="prevMonth" aria-label="Mes anterior" title="Mes anterior">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="month-label" id="monthLabel" title="Volver al mes actual"></button>
      <button class="icon-btn" id="nextMonth" aria-label="Mes siguiente" title="Mes siguiente">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
    <div class="title-wrap">
      <button class="icon-btn" id="backBtn" aria-label="Volver" title="Volver" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1 id="pageTitle" hidden></h1>
    </div>
    <button class="icon-btn gear" id="settingsBtn" aria-label="Ajustes" title="Ajustes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span id="syncDot" class="sync-dot hidden" aria-hidden="true"></span>
    </button>
  </header>

  <main id="view" tabindex="-1"></main>

  <button id="fab" class="fab" aria-label="Agregar">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="tabbar" aria-label="Secciones">
    <button data-tab="inicio">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Inicio</span>
    </button>
    <button data-tab="movimientos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16M7 4 3 8M7 4l4 4M17 20V4M17 20l-4-4M17 20l4-4"/></svg>
      <span>Registro</span>
    </button>
    <button data-tab="pagos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 15h2"/></svg>
      <span>Pagos</span>
    </button>
    <button data-tab="deudas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>
      <span>Tarjetas</span>
    </button>
    <button data-tab="clientes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21v-1a7 7 0 0 1 14 0v1M16 3.5a4 4 0 0 1 0 8M22 21v-1a7 7 0 0 0-4-6.3"/></svg>
      <span>Clientes</span>
    </button>
    <button data-tab="mas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span>Más</span>
    </button>
  </nav>

  <dialog id="ask" aria-labelledby="askTitle">
    <form method="dialog">
      <h2 id="askTitle"></h2>
      <p id="askText"></p>
      <div class="btn-row"><button class="btn" value="no" id="askNo">Cancelar</button><button class="btn primary" value="yes" id="askYes">Aceptar</button></div>
    </form>
  </dialog>

  <dialog id="sheet" aria-labelledby="sheetTitle">
    <form id="sheetForm" novalidate></form>
  </dialog>

  <input type="file" id="importFile" accept=".json,application/json" hidden>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
  <script type="module" src="sync.js"></script>
</body>
</html>
